name: Cypress Scheduled Tests

on:
  schedule:
    # 6:15 PM Bhutan Time (BTT = UTC+6) → 12:15 UTC
    - cron: '15 12 * * *'
  workflow_dispatch: # allow manual trigger

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Mochawesome reporter
        run: yarn add --dev mochawesome mochawesome-merge mochawesome-report-generator

      - name: Run Cypress tests
        run: |
          npx cypress run \
            --reporter mochawesome \
            --reporter-options "reportDir=cypress/reports,overwrite=false,html=false,json=true"
        continue-on-error: true

      - name: Merge reports
        if: always()
        run: npx mochawesome-merge "cypress/reports/*.json" -o cypress/reports/merged.json

      - name: Generate HTML report
        if: always()
        run: npx marge cypress/reports/merged.json --reportDir cypress/reports --inline

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report-${{ github.run_number }}
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
          retention-days: 14
